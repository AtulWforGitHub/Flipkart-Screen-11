<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flipkart Price Monitor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a10;
      color: #d4d4d8;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      padding: 28px 32px;
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }
    .header-left h1 { font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
    .header-left p  { font-size: 0.72rem; color: #3f3f5a; margin-top: 3px; }
    .header-right   { display: flex; align-items: center; gap: 14px; }

    /* ── Live dot ── */
    .live-badge { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: #52525b; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px #22c55e88; animation: breathe 2s ease-in-out infinite; }
    .dot.off { background: #ef4444; box-shadow: none; animation: none; }
    @keyframes breathe { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    /* ── Add button ── */
    .btn-add {
      display: flex; align-items: center; gap: 6px;
      background: #2563eb; color: #fff; border: none; border-radius: 7px;
      padding: 8px 16px; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s, transform 0.1s;
    }
    .btn-add:hover  { background: #1d4ed8; }
    .btn-add:active { transform: scale(0.97); }

    /* ── Add form ── */
    .add-form {
      display: none; background: #13131c;
      border: 1px solid #2563eb33; border-radius: 10px;
      padding: 18px 20px; margin-bottom: 18px;
      gap: 14px; align-items: flex-end; flex-wrap: wrap;
    }
    .add-form.open { display: flex; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #52525b; }
    .field input {
      background: #0a0a10; border: 1px solid #27272a; border-radius: 6px;
      color: #e4e4e7; padding: 8px 12px; font-size: 0.85rem; min-width: 200px;
      outline: none; font-family: inherit; transition: border-color 0.15s;
    }
    .field input:focus { border-color: #2563eb; }
    .field input.wide { min-width: 300px; }
    .form-actions { display: flex; gap: 8px; }
    .btn-submit {
      background: #2563eb; color: #fff; border: none; border-radius: 6px;
      padding: 8px 18px; font-size: 0.83rem; font-weight: 600; cursor: pointer;
    }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-cancel {
      background: transparent; color: #71717a; border: 1px solid #27272a;
      border-radius: 6px; padding: 8px 14px; font-size: 0.83rem; cursor: pointer;
    }
    .btn-cancel:hover { background: #27272a88; }
    .form-error { font-size: 0.78rem; color: #f87171; margin-top: 6px; display: none; }

    /* ── Search ── */
    .search-box {
      margin-bottom: 18px; display: flex; align-items: center; gap: 10px;
    }
    .search-box input {
      background: #13131c; border: 1px solid #27272a; border-radius: 8px;
      color: #e4e4e7; padding: 10px 16px; font-size: 0.85rem; flex: 1;
      outline: none; font-family: inherit; transition: border-color 0.15s;
      max-width: 400px;
    }
    .search-box input:focus { border-color: #2563eb; }
    .search-box input::placeholder { color: #52525b; }
    .search-icon {
      color: #52525b; font-size: 1.1rem; display: flex; align-items: center;
    }

    /* ── Card ── */
    .card { background: #13131c; border: 1px solid #1e1e2e; border-radius: 12px; overflow: hidden; }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 11px 18px;
      font-size: 0.63rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.09em;
      color: #3f3f5a; text-align: left; white-space: nowrap;
      border-bottom: 1px solid #1e1e2e;
    }
    thead th.right { text-align: right; }
    tbody tr { border-top: 1px solid #18182a; transition: background 0.12s; }
    tbody tr:hover { background: #15151f; }
    td { padding: 14px 18px; vertical-align: middle; }
    td.right { text-align: right; }

    /* Product */
    .prod-name { font-weight: 600; color: #e4e4e7; font-size: 0.9rem; }
    .prod-name a { color: #e4e4e7; text-decoration: none; }
    .prod-name a:hover { color: #60a5fa; text-decoration: underline; }
    .prod-pid  { font-size: 0.63rem; color: #52527a; font-family: monospace; margin-top: 3px; }
    .prod-lid  { font-size: 0.63rem; color: #52527a; font-family: monospace; margin-top: 1px; }

    /* Price */
    .price-wrap { display: inline-flex; flex-direction: column; align-items: flex-end; }
    .price-val  { font-weight: 700; font-size: 1.05rem; color: #fff; }
    .price-na   { color: #52527a; font-size: 0.85rem; }
    .price-prev { display: flex; align-items: center; gap: 4px; font-size: 0.71rem; margin-top: 4px; font-weight: 600; }
    .price-prev.down { color: #4ade80; }
    .price-prev.up   { color: #f87171; }
    .price-prev .was { font-weight: 400; color: #52525b; }

    /* Status */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.63rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    .badge-ok      { background: #052e16; color: #4ade80; }
    .badge-error   { background: #2d0707; color: #f87171; }
    .badge-blocked { background: #2d1507; color: #fb923c; }
    .badge-pending { background: #18181f; color: #71718a; }
    .badge-timeout { background: #1c1c07; color: #facc15; }

    /* Actions */
    .cell-actions { text-align: right; white-space: nowrap; display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
    .btn-edit {
      background: transparent; border: none;
      color: #71717a; font-size: 1rem;
      cursor: pointer; padding: 4px;
      transition: all 0.15s; line-height: 1;
    }
    .btn-edit:hover { color: #3b82f6; transform: scale(1.15); }
    .btn-del {
      background: transparent; border: 1px solid #3f1a1a; color: #7f3f3f;
      border-radius: 5px; padding: 4px 9px; font-size: 0.72rem; cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn-del:hover { background: #2d0707; border-color: #f87171; color: #f87171; }

    .ts { font-size: 0.68rem; color: #71718a; font-family: monospace; }

    /* Flash */
    @keyframes flashGreen { 0% { background: #052e1655; } 100% { background: transparent; } }
    @keyframes flashRed   { 0% { background: #2d070755; } 100% { background: transparent; } }
    tr.flash-green { animation: flashGreen 2s ease forwards; }
    tr.flash-red   { animation: flashRed   2s ease forwards; }

    .empty-row td { padding: 48px 18px; text-align: center; color: #2a2a3c; font-size: 0.85rem; }

    /* ── Toast ── */
    #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 999; pointer-events: none; }
    .toast {
      background: #1a1a28; border: 1px solid #27272a; border-radius: 8px;
      padding: 12px 16px; max-width: 300px; font-size: 0.8rem; line-height: 1.5;
      animation: slideIn 0.25s ease, fadeOut 0.4s ease 4.6s forwards;
      pointer-events: auto;
    }
    .toast.down { border-left: 3px solid #4ade80; }
    .toast.up   { border-left: 3px solid #f87171; }
    .toast-name { font-weight: 700; color: #e4e4e7; margin-bottom: 3px; }
    .toast-body { color: #71717a; }
    .toast-body .hl.down { color: #4ade80; font-weight: 600; }
    .toast-body .hl.up   { color: #f87171; font-weight: 600; }
    @keyframes slideIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }
    @keyframes fadeOut { from { opacity:1; } to { opacity:0; } }

    /* ── Mobile / responsive ── */
    @media (max-width: 820px) {
      body { padding: 16px 13px; font-size: 15px; }
      header { flex-direction: column; align-items: stretch; gap: 14px; margin-bottom: 16px; }
      .header-right { justify-content: space-between; }
      .btn-add { flex: 1; justify-content: center; padding: 11px 16px; }

      .add-form { flex-direction: column; align-items: stretch; padding: 16px; }
      .field { width: 100%; }
      .field input, .field input.wide { min-width: 0; width: 100%; }
      .form-actions { width: 100%; }
      .btn-submit, .btn-cancel { flex: 1; padding: 11px; }

      .search-box { margin-bottom: 14px; }
      .search-box input { max-width: none; width: 100%; }

      /* Stack the table into per-product cards */
      .card { background: transparent; border: none; border-radius: 0; overflow: visible; }
      table, tbody, tr, td { display: block; width: 100%; }
      thead { display: none; }
      tbody tr {
        background: #13131c; border: 1px solid #1e1e2e; border-radius: 12px;
        margin-bottom: 14px; padding: 4px 2px;
      }
      tbody tr:hover { background: #13131c; }
      td {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; padding: 11px 16px; text-align: right;
      }
      td[data-label]::before {
        content: attr(data-label);
        flex: 0 0 auto;
        font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.06em; color: #52525b; text-align: left;
      }
      /* Product cell = card header (full width, no label) */
      td.cell-product {
        display: block; text-align: left; padding: 14px 16px 11px;
        border-bottom: 1px solid #18182a;
      }
      .prod-name { font-size: 1rem; }
      .price-wrap { align-items: flex-end; }
      /* Actions = full-width footer */
      td.cell-actions { padding: 10px 16px 14px; display: flex; gap: 8px; justify-content: flex-end; }
      td.cell-actions .btn-edit { padding: 8px; font-size: 1.1rem; }
      td.cell-actions .btn-del { flex: 1; padding: 11px; font-size: 0.85rem; }

      /* Toasts span the screen width */
      #toast-container { left: 12px; right: 12px; bottom: 12px; }
      .toast { max-width: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Flipkart Price Monitor</h1>
    <p>Tracking FSP &amp; NEP prices</p>
  </div>
  <div class="header-right">
    <div class="live-badge">
      <div class="dot" id="dot"></div>
      <span id="conn-label">Connecting…</span>
    </div>
    <button class="btn-add" onclick="toggleForm()">
      + Add Product
    </button>
  </div>
</header>

<!-- Add form -->
<div class="add-form" id="add-form">
  <div class="field">
    <label>Flipkart Product URL</label>
    <input type="text" id="input-url" class="wide" placeholder="Paste full product URL — e.g. https://www.flipkart.com/.../p/itm...?pid=..."
           onkeydown="if(event.key==='Enter') submitProduct()" />
  </div>
  <div class="field">
    <label>Product Name (optional)</label>
    <input type="text" id="input-name" class="wide" placeholder="Auto-detected from the URL if left blank"
           onkeydown="if(event.key==='Enter') submitProduct()" />
  </div>
  <div class="field">
    <label>Target Lowest Price (optional)</label>
    <input type="number" id="input-target" placeholder="e.g. 50000" style="min-width:150px"
           onkeydown="if(event.key==='Enter') submitProduct()" />
  </div>
  <div>
    <div class="form-actions">
      <button class="btn-submit" onclick="submitProduct()">Add</button>
      <button class="btn-cancel" onclick="toggleForm()">Cancel</button>
    </div>
    <div class="form-error" id="form-error"></div>
  </div>
</div>

<!-- Search -->
<div class="search-box">
  <span class="search-icon">🔍</span>
  <input type="text" id="search-input" placeholder="Search by product name, PID, or URL..." oninput="filterProducts()" />
</div>

<!-- Account Section - Add New Account Only -->
<div class="card" style="margin-bottom: 18px; padding: 18px 20px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
    <div>
      <h3 style="font-size: 0.9rem; font-weight: 600; color: #fff; margin-bottom: 4px;">Flipkart Account</h3>
      <p style="font-size: 0.72rem;" id="account-status">Loading...</p>
    </div>
    <button class="btn-add" onclick="toggleAccountForm()" id="btn-toggle-account" style="font-size: 0.78rem; padding: 6px 12px;">
      + Add Account
    </button>
  </div>
  
  <!-- Login Form -->
  <div id="account-form" style="display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid #27272a;">
    <div id="login-step-1" style="display: flex; gap: 10px; align-items: flex-end;">
      <div class="field" style="flex: 1; max-width: 250px;">
        <label>Phone / Email</label>
        <input type="text" id="input-phone" placeholder="Enter phone or email" 
               onkeydown="if(event.key==='Enter') startLogin()" />
      </div>
      <button class="btn-submit" onclick="startLogin()" id="btn-send-otp">Send OTP</button>
      <button class="btn-cancel" onclick="toggleAccountForm()">Cancel</button>
    </div>
    
    <div id="login-step-2" style="display: none; margin-top: 12px;">
      <div style="display: flex; gap: 10px; align-items: flex-end;">
        <div class="field" style="flex: 1; max-width: 200px;">
          <label>Enter OTP</label>
          <input type="text" id="input-otp" placeholder="6-digit code" maxlength="6"
                 onkeydown="if(event.key==='Enter') verifyOTP()" />
        </div>
        <button class="btn-submit" onclick="verifyOTP()" id="btn-verify-otp">Verify</button>
        <button class="btn-cancel" onclick="cancelLogin()">Cancel</button>
      </div>
      <p style="font-size: 0.72rem; color: #71717a; margin-top: 8px;">
        OTP sent to <span id="phone-display"></span>
      </p>
    </div>
    
    <div id="login-status" style="display: none; margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 0.8rem;">
    </div>
  </div>
</div>

<!-- Table -->
<div class="card">
  <table>
    <thead>
      <tr>
        <th>Product</th>
        <th class="right">Price <span style="font-weight:400;opacity:.4">(FSP)</span> <span style="display:inline-block;width:10px;height:3px;background:#60a5fa;border-radius:2px;vertical-align:middle;margin-left:4px"></span></th>
        <th class="right">Lowest Price <span style="font-weight:400;opacity:.4">(NEP)</span> <span style="display:inline-block;width:10px;height:3px;background:#4ade80;border-radius:2px;vertical-align:middle;margin-left:4px"></span></th>
        <th class="right">Target Lowest</th>
        <th class="right">All-time Low <span style="font-weight:400;color:#60a5fa;opacity:.7">(FSP)</span></th>
        <th class="right">All-time Low <span style="font-weight:400;color:#4ade80;opacity:.7">(NEP)</span></th>
        <th class="right">All-time High <span style="font-weight:400;color:#60a5fa;opacity:.7">(FSP)</span></th>
        <th class="right">All-time High <span style="font-weight:400;color:#4ade80;opacity:.7">(NEP)</span></th>
        <th>Status</th>
        <th>Last Hit</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr class="empty-row" id="empty-row"><td colspan="11">Waiting for first data…</td></tr>
    </tbody>
  </table>
</div>

<div id="toast-container"></div>

<script>
  const tbody     = document.getElementById('tbody');
  const dot       = document.getElementById('dot');
  const connLabel = document.getElementById('conn-label');
  const toastBox  = document.getElementById('toast-container');
  const searchInput = document.getElementById('search-input');

  // Search/filter functionality
  function filterProducts() {
    const query = searchInput.value.toLowerCase().trim();
    const rows = tbody.querySelectorAll('tr:not(.empty-row)');
    
    rows.forEach(row => {
      const nameEl = row.querySelector('.prod-name');
      const pidEl = row.querySelector('.prod-pid');
      const urlEl = row.querySelector('.prod-name a');
      
      const name = nameEl ? nameEl.textContent.toLowerCase() : '';
      const pid = pidEl ? pidEl.textContent.toLowerCase() : '';
      const url = urlEl ? urlEl.getAttribute('href').toLowerCase() : '';
      
      const matches = name.includes(query) || pid.includes(query) || url.includes(query);
      row.style.display = matches ? '' : 'none';
    });
  }

  // pid → ISO string of last successful scrape
  const lastSuccessTs = {};

  function timeAgo(isoStr) {
    if (!isoStr) return '—';
    const secs = Math.floor((Date.now() - new Date(isoStr).getTime()) / 1000);
    if (secs < 60)   return secs + 's ago';
    if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
    return Math.floor(secs / 3600) + 'h ago';
  }

  // Tick every second to refresh all "X ago" cells
  setInterval(() => {
    for (const [pid, ts] of Object.entries(lastSuccessTs)) {
      const el = document.getElementById('ts-cell-' + pid);
      if (el) el.innerHTML = `<span class="ts">${timeAgo(ts)}</span>`;
    }
  }, 1000);

  function inr(n) {
    return n != null ? '₹' + Number(n).toLocaleString('en-IN') : null;
  }

  function badgeCls(s) {
    if (!s || s === 'PENDING') return 'badge-pending';
    if (s === 'OK')            return 'badge-ok';
    if (s === 'TIMEOUT')       return 'badge-timeout';
    if (s === 'BLOCKED')       return 'badge-blocked';
    return 'badge-error';
  }

  function shortStatus(s) {
    if (!s || s === 'PENDING') return 'PENDING';
    if (s.startsWith('ERROR:')) return 'ERROR';
    return s;
  }

  function priceCell(val, prev, dir) {
    if (val == null) return `<div class="price-na">—</div>`;
    let html = `<div class="price-wrap"><div class="price-val">${inr(val)}</div>`;
    if (prev != null && dir) {
      const arrow = dir === 'DOWN' ? '▼' : '▲';
      const cls   = dir === 'DOWN' ? 'down' : 'up';
      html += `<div class="price-prev ${cls}">${arrow} <span class="was">was ${inr(prev)}</span></div>`;
    }
    return html + `</div>`;
  }

  // ── Row rendering ──────────────────────────────────────────────────────────
  function upsertRow(p) {
    document.getElementById('empty-row')?.remove();

    let row = document.getElementById('row-' + p.pid);
    const isNew = !row;

    if (isNew) {
      row = document.createElement('tr');
      row.id = 'row-' + p.pid;
      tbody.appendChild(row);
    }

    if (isNew) {
      row.innerHTML = `
        <td class="cell-product">
          <div class="prod-name" id="name-${p.pid}">
            <span class="name-display">${p.url
              ? `<a href="${escHtml(p.url)}" target="_blank" rel="noopener">${escHtml(p.name)}</a>`
              : escHtml(p.name)}</span>
            <input type="text" class="name-edit" value="${escHtml(p.name)}" style="display:none;width:100%;padding:4px;background:#0a0a10;border:1px solid #3b82f6;border-radius:4px;color:#e4e4e7;font-size:0.9rem" />
          </div>
          <div class="prod-pid">PID: ${p.pid}</div>
          <div class="prod-lid" id="lid-${p.pid}">
            <span class="lid-display">LID: ${p.lid || 'N/A'}</span>
            <input type="text" class="lid-edit" value="${p.lid || ''}" placeholder="LID" style="display:none;width:100%;padding:4px;background:#0a0a10;border:1px solid #3b82f6;border-radius:4px;color:#e4e4e7;font-size:0.75rem;font-family:monospace" />
          </div>
        </td>
        <td class="right" data-label="Price (FSP)" id="price-cell-${p.pid}">${priceCell(p.price, p.price_prev, p.price_dir)}</td>
        <td class="right" data-label="Lowest (NEP)" id="lowest-cell-${p.pid}">${priceCell(p.lowest_price, p.lowest_prev, p.lowest_dir)}</td>
        <td class="right" data-label="Target Lowest" id="target-cell-${p.pid}">
          <span class="target-display" style="color:#fbbf24;font-weight:600">${p.target_lowest ? inr(p.target_lowest) : '—'}</span>
          <input type="number" class="target-edit" value="${p.target_lowest || ''}" placeholder="Target" style="display:none;width:100px;padding:4px;background:#0a0a10;border:1px solid #3b82f6;border-radius:4px;color:#e4e4e7;text-align:right" />
        </td>
        <td class="right" data-label="All-time Low (FSP)" id="low-fsp-cell-${p.pid}"><span style="color:#60a5fa;font-weight:600">${inr(p.all_time_low_fsp) || '—'}</span></td>
        <td class="right" data-label="All-time Low (NEP)" id="low-nep-cell-${p.pid}"><span style="color:#4ade80;font-weight:600">${inr(p.all_time_low_nep) || '—'}</span></td>
        <td class="right" data-label="All-time High (FSP)" id="high-fsp-cell-${p.pid}"><span style="color:#60a5fa;font-weight:600">${inr(p.all_time_high_fsp) || '—'}</span></td>
        <td class="right" data-label="All-time High (NEP)" id="high-nep-cell-${p.pid}"><span style="color:#4ade80;font-weight:600">${inr(p.all_time_high_nep) || '—'}</span></td>
        <td data-label="Status" id="badge-cell-${p.pid}"><span class="badge ${badgeCls(p.status)}">${shortStatus(p.status)}</span></td>
        <td data-label="Last Hit" id="ts-cell-${p.pid}"><span class="ts">${p.last_success_ts ? (() => { lastSuccessTs[p.pid] = p.last_success_ts; return timeAgo(p.last_success_ts); })() : '—'}</span></td>
        <td class="cell-actions">
          <button class="btn-edit" onclick="toggleEdit('${p.pid}')" title="Edit product">✏️</button>
          <button class="btn-save" onclick="saveEdit('${p.pid}')" style="display:none;background:#10b981;color:#fff;border:none;padding:4px 10px;border-radius:4px;font-size:0.72rem;cursor:pointer">Save</button>
          <button class="btn-cancel" onclick="cancelEdit('${p.pid}')" style="display:none;background:transparent;color:#71717a;border:1px solid #27272a;padding:3px 8px;border-radius:4px;font-size:0.72rem;cursor:pointer">Cancel</button>
          <button class="btn-del" onclick="deleteProduct('${p.pid}')">✕ Remove</button>
        </td>
      `;
    } else {
      // Only update the cells that change
      const nameEl = document.getElementById('name-' + p.pid);
      const priceEl  = document.getElementById('price-cell-'  + p.pid);
      const lowestEl = document.getElementById('lowest-cell-' + p.pid);
      const targetEl = document.getElementById('target-cell-' + p.pid);
      const badgeEl  = document.getElementById('badge-cell-'  + p.pid);
      const tsEl     = document.getElementById('ts-cell-'     + p.pid);
      
      if (nameEl && nameEl.querySelector('.name-display')) {
        nameEl.querySelector('.name-display').innerHTML = p.url
          ? `<a href="${escHtml(p.url)}" target="_blank" rel="noopener">${escHtml(p.name)}</a>`
          : escHtml(p.name);
        nameEl.querySelector('.name-edit').value = p.name;
      }
      const lidEl = document.getElementById('lid-' + p.pid);
      if (lidEl && lidEl.querySelector('.lid-display')) {
        lidEl.querySelector('.lid-display').textContent = `LID: ${p.lid || 'N/A'}`;
        lidEl.querySelector('.lid-edit').value = p.lid || '';
      }
      if (priceEl)  priceEl.innerHTML  = priceCell(p.price,        p.price_prev,  p.price_dir);
      if (lowestEl) lowestEl.innerHTML = priceCell(p.lowest_price, p.lowest_prev, p.lowest_dir);
      if (targetEl && targetEl.querySelector('.target-display')) {
        targetEl.querySelector('.target-display').innerHTML = `<span style="color:#fbbf24;font-weight:600">${p.target_lowest ? inr(p.target_lowest) : '—'}</span>`;
        targetEl.querySelector('.target-edit').value = p.target_lowest || '';
      }
      
      const lowFspEl = document.getElementById('low-fsp-cell-' + p.pid);
      const lowNepEl = document.getElementById('low-nep-cell-' + p.pid);
      const highFspEl = document.getElementById('high-fsp-cell-' + p.pid);
      const highNepEl = document.getElementById('high-nep-cell-' + p.pid);
      if (lowFspEl) lowFspEl.innerHTML = `<span style="color:#60a5fa;font-weight:600">${inr(p.all_time_low_fsp) || '—'}</span>`;
      if (lowNepEl) lowNepEl.innerHTML = `<span style="color:#4ade80;font-weight:600">${inr(p.all_time_low_nep) || '—'}</span>`;
      if (highFspEl) highFspEl.innerHTML = `<span style="color:#60a5fa;font-weight:600">${inr(p.all_time_high_fsp) || '—'}</span>`;
      if (highNepEl) highNepEl.innerHTML = `<span style="color:#4ade80;font-weight:600">${inr(p.all_time_high_nep) || '—'}</span>`;
      if (badgeEl)  badgeEl.innerHTML  = `<span class="badge ${badgeCls(p.status)}">${shortStatus(p.status)}</span>`;
      if (p.last_success_ts) {
        lastSuccessTs[p.pid] = p.last_success_ts;
        if (tsEl) tsEl.innerHTML = `<span class="ts">${timeAgo(p.last_success_ts)}</span>`;
      }
    }

    // Flash + toast on price change
    if (!isNew && (p.price_dir || p.lowest_dir)) {
      const dir = p.price_dir || p.lowest_dir;
      row.classList.remove('flash-green', 'flash-red');
      void row.offsetWidth;
      row.classList.add(dir === 'DOWN' ? 'flash-green' : 'flash-red');
      showToast(p);
    }
  }

  function showToast(p) {
    const parts = [];
    if (p.price_dir && p.price_prev != null)
      parts.push(`Price: <span class="hl ${p.price_dir.toLowerCase()}">${inr(p.price_prev)} → ${inr(p.price)}</span>`);
    if (p.lowest_dir && p.lowest_prev != null)
      parts.push(`Lowest: <span class="hl ${p.lowest_dir.toLowerCase()}">${inr(p.lowest_prev)} → ${inr(p.lowest_price)}</span>`);
    if (!parts.length) return;

    const dir = p.price_dir || p.lowest_dir;
    const t   = document.createElement('div');
    t.className = `toast ${dir.toLowerCase()}`;
    t.innerHTML = `<div class="toast-name">${escHtml(p.name)}</div><div class="toast-body">${parts.join('<br>')}</div>`;
    toastBox.appendChild(t);
    setTimeout(() => t.remove(), 5200);
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function deleteProduct(pid) {
    if (!confirm('Stop tracking this product?')) return;
    try {
      const res = await fetch('/products/' + pid, { method: 'DELETE' });
      if (!res.ok) { const d = await res.json(); alert('Delete failed: ' + (d.detail || res.status)); return; }
      document.getElementById('row-' + pid)?.remove();
      delete lastSuccessTs[pid];
      if (!tbody.querySelector('tr:not(.empty-row)')) {
        tbody.innerHTML = '<tr class="empty-row" id="empty-row"><td colspan="10">No products tracked yet.</td></tr>';
      }
    } catch (e) { alert('Delete failed: ' + e); }
  }

  // ── Add form ───────────────────────────────────────────────────────────────
  function toggleForm() {
    const form = document.getElementById('add-form');
    form.classList.toggle('open');
    document.getElementById('form-error').style.display = 'none';
    if (form.classList.contains('open')) {
      document.getElementById('input-url').focus();
    } else {
      document.getElementById('input-url').value  = '';
      document.getElementById('input-name').value = '';
      document.getElementById('input-target').value = '';
    }
  }

  async function submitProduct() {
    const url   = document.getElementById('input-url').value.trim();
    const name  = document.getElementById('input-name').value.trim();
    const target = document.getElementById('input-target').value.trim();
    const targetLowest = target ? parseInt(target) : null;
    const errEl = document.getElementById('form-error');
    errEl.style.display = 'none';
    if (!url) { showFormError('Paste a Flipkart product URL'); return; }

    const btn = document.querySelector('.btn-submit');
    btn.textContent = 'Adding…'; btn.disabled = true;
    try {
      const body = { url, name };
      if (targetLowest) body.target_lowest = targetLowest;
      const res  = await fetch('/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) { showFormError(data.detail || 'Error'); return; }
      document.getElementById('input-url').value = '';
      document.getElementById('input-name').value = '';
      document.getElementById('input-target').value = '';
      toggleForm();
    } catch (e) {
      showFormError('Network error');
    } finally {
      btn.textContent = 'Add'; btn.disabled = false;
    }
  }

  function toggleEdit(pid) {
    const row = document.getElementById('row-' + pid);
    const nameCell = row.querySelector('#name-' + pid);
    const lidCell = row.querySelector('#lid-' + pid);
    const targetCell = row.querySelector('#target-cell-' + pid);
    const actionsCell = row.querySelector('.cell-actions');
    
    // Toggle display
    nameCell.querySelector('.name-display').style.display = 'none';
    nameCell.querySelector('.name-edit').style.display = 'block';
    nameCell.querySelector('.name-edit').focus();
    
    if (lidCell) {
      lidCell.querySelector('.lid-display').style.display = 'none';
      lidCell.querySelector('.lid-edit').style.display = 'block';
    }
    
    targetCell.querySelector('.target-display').style.display = 'none';
    targetCell.querySelector('.target-edit').style.display = 'block';
    
    actionsCell.querySelector('.btn-edit').style.display = 'none';
    actionsCell.querySelector('.btn-save').style.display = 'inline-block';
    actionsCell.querySelector('.btn-cancel').style.display = 'inline-block';
    actionsCell.querySelector('.btn-del').style.display = 'none';
  }

  function cancelEdit(pid) {
    const row = document.getElementById('row-' + pid);
    const nameCell = row.querySelector('#name-' + pid);
    const lidCell = row.querySelector('#lid-' + pid);
    const targetCell = row.querySelector('#target-cell-' + pid);
    const actionsCell = row.querySelector('.cell-actions');
    
    // Reset to display mode
    nameCell.querySelector('.name-display').style.display = 'block';
    nameCell.querySelector('.name-edit').style.display = 'none';
    
    if (lidCell) {
      lidCell.querySelector('.lid-display').style.display = 'block';
      lidCell.querySelector('.lid-edit').style.display = 'none';
    }
    
    targetCell.querySelector('.target-display').style.display = 'block';
    targetCell.querySelector('.target-edit').style.display = 'none';
    
    actionsCell.querySelector('.btn-edit').style.display = 'inline-block';
    actionsCell.querySelector('.btn-save').style.display = 'none';
    actionsCell.querySelector('.btn-cancel').style.display = 'none';
    actionsCell.querySelector('.btn-del').style.display = 'inline-block';
  }

  async function saveEdit(pid) {
    const row = document.getElementById('row-' + pid);
    const nameInput = row.querySelector('#name-' + pid + ' .name-edit');
    const lidCell = row.querySelector('#lid-' + pid);
    const lidInput = lidCell ? lidCell.querySelector('.lid-edit') : null;
    const targetInput = row.querySelector('#target-cell-' + pid + ' .target-edit');
    
    const newName = nameInput.value.trim();
    const newLid = lidInput ? lidInput.value.trim() : '';
    const newTarget = targetInput.value.trim() ? parseInt(targetInput.value) : 0;
    
    if (!newName) {
      alert('Product name cannot be empty');
      return;
    }
    
    try {
      const body = { name: newName, target_lowest: newTarget };
      if (newLid) body.lid = newLid;
      
      const res = await fetch(`/products/${pid}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      
      if (!res.ok) {
        const data = await res.json();
        alert(data.detail || 'Error updating product');
        return;
      }
      
      // Success - cancel edit mode (will update from SSE)
      cancelEdit(pid);
    } catch (e) {
      alert('Network error');
    }
  }

  async function editProduct(pid, currentName, currentTarget) {
    const newName = prompt('Edit product name:', currentName);
    if (newName === null) return; // User cancelled
    
    const targetStr = currentTarget ? String(currentTarget) : '';
    const newTargetStr = prompt('Edit target lowest price (leave empty to remove):', targetStr);
    if (newTargetStr === null) return; // User cancelled
    
    const newTarget = newTargetStr.trim() ? parseInt(newTargetStr) : 0;
    
    try {
      const res = await fetch(`/products/${pid}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          name: newName.trim(), 
          target_lowest: newTarget 
        }),
      });
      if (!res.ok) {
        const data = await res.json();
        alert(data.detail || 'Error updating product');
      }
    } catch (e) {
      alert('Network error');
    }
  }

  function showFormError(msg) {
    const el = document.getElementById('form-error');
    el.textContent = msg; el.style.display = 'block';
  }

  // ── Account Management ─────────────────────────────────────────────────────
  let loginPollInterval = null;

  async function loadCurrentAccount() {
    try {
      const res = await fetch('/api/accounts');
      const data = await res.json();
      const activeAccount = data.accounts.find(a => a.active);
      
      if (activeAccount) {
        document.getElementById('account-status').textContent = `Logged in as: ${activeAccount.name}`;
        document.getElementById('account-status').style.color = '#4ade80';
        document.getElementById('btn-toggle-account').textContent = 'Change Account';
      } else {
        document.getElementById('account-status').textContent = 'No account logged in';
        document.getElementById('account-status').style.color = '#71717a';
        document.getElementById('btn-toggle-account').textContent = '+ Add Account';
      }
    } catch (e) {
      console.error('Failed to load account:', e);
    }
  }

  function toggleAccountForm() {
    const form = document.getElementById('account-form');
    const isOpen = form.style.display !== 'none';
    
    if (isOpen) {
      // Close form
      form.style.display = 'none';
      resetLoginForm();
    } else {
      // Open form
      form.style.display = 'block';
      document.getElementById('input-phone').focus();
    }
  }

  function resetLoginForm() {
    document.getElementById('login-step-1').style.display = 'flex';
    document.getElementById('login-step-2').style.display = 'none';
    document.getElementById('login-status').style.display = 'none';
    document.getElementById('input-phone').value = '';
    document.getElementById('input-otp').value = '';
    
    // Reset Send OTP button
    const btnSendOtp = document.getElementById('btn-send-otp');
    btnSendOtp.textContent = 'Send OTP';
    btnSendOtp.disabled = false;
    
    // Reset Verify button
    const btnVerifyOtp = document.getElementById('btn-verify-otp');
    btnVerifyOtp.textContent = 'Verify';
    btnVerifyOtp.disabled = false;
    
    if (loginPollInterval) {
      clearInterval(loginPollInterval);
      loginPollInterval = null;
    }
  }

  async function startLogin() {
    const phone = document.getElementById('input-phone').value.trim();
    
    if (!phone) {
      showLoginStatus('Please enter phone number or email', 'error');
      return;
    }

    const btn = document.getElementById('btn-send-otp');
    btn.textContent = 'Sending...';
    btn.disabled = true;

    try {
      const res = await fetch('/api/account/login-start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone })
      });

      if (!res.ok) {
        const data = await res.json();
        showLoginStatus(data.detail || 'Failed to send OTP', 'error');
        btn.textContent = 'Send OTP';
        btn.disabled = false;
        return;
      }

      // Show OTP input step
      document.getElementById('login-step-1').style.display = 'none';
      document.getElementById('login-step-2').style.display = 'block';
      document.getElementById('phone-display').textContent = phone;
      showLoginStatus('Opening browser, requesting OTP...', 'info');

      // Start polling for status
      loginPollInterval = setInterval(checkLoginStatus, 2000);

    } catch (e) {
      showLoginStatus('Network error: ' + e.message, 'error');
      btn.textContent = 'Send OTP';
      btn.disabled = false;
    }
  }

  async function checkLoginStatus() {
    try {
      const res = await fetch('/api/account/login-status');
      const data = await res.json();

      if (data.status === 'waiting_otp') {
        showLoginStatus('✓ OTP sent. Enter it below.', 'success');
        document.getElementById('input-otp').focus();
        if (loginPollInterval) {
          clearInterval(loginPollInterval);
          loginPollInterval = null;
        }
      } else if (data.status === 'timeout') {
        showLoginStatus('Login timeout - browser closed after 5 minutes', 'error');
        if (loginPollInterval) {
          clearInterval(loginPollInterval);
          loginPollInterval = null;
        }
        setTimeout(() => cancelLogin(), 2000);
      } else if (data.status === 'cancelled') {
        showLoginStatus('Login cancelled', 'error');
        if (loginPollInterval) {
          clearInterval(loginPollInterval);
          loginPollInterval = null;
        }
      } else if (data.status === 'success') {
        showLoginStatus(`✓ Success! Logged in as ${data.account_name}. Restarting app...`, 'success');
        if (loginPollInterval) {
          clearInterval(loginPollInterval);
          loginPollInterval = null;
        }
        
        // Wait 2 seconds then restart app
        setTimeout(async () => {
          await fetch('/admin/restart', { method: 'POST' });
          showLoginStatus('App restarting... Page will reload in 10 seconds.', 'info');
          setTimeout(() => location.reload(), 10000);
        }, 2000);
        
      } else if (data.status === 'error') {
        showLoginStatus('Error: ' + data.error, 'error');
        if (loginPollInterval) {
          clearInterval(loginPollInterval);
          loginPollInterval = null;
        }
      } else if (data.status === 'starting') {
        showLoginStatus('Opening headless browser...', 'info');
      } else if (data.status === 'verifying') {
        showLoginStatus('Verifying OTP...', 'info');
      }
    } catch (e) {
      console.error('Status check failed:', e);
    }
  }

  async function verifyOTP() {
    const otp = document.getElementById('input-otp').value.trim();
    
    if (!otp || otp.length !== 6) {
      showLoginStatus('Please enter a valid 6-digit OTP', 'error');
      return;
    }

    const btn = document.getElementById('btn-verify-otp');
    btn.textContent = 'Verifying...';
    btn.disabled = true;

    try {
      const res = await fetch('/api/account/login-verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ otp })
      });

      if (!res.ok) {
        const data = await res.json();
        showLoginStatus(data.detail || 'Verification failed', 'error');
        btn.textContent = 'Verify';
        btn.disabled = false;
        return;
      }

      showLoginStatus('Verifying OTP...', 'info');
      // Start polling for final status
      loginPollInterval = setInterval(checkLoginStatus, 1000);

    } catch (e) {
      showLoginStatus('Network error: ' + e.message, 'error');
      btn.textContent = 'Verify';
      btn.disabled = false;
    }
  }

  async function cancelLogin() {
    // Close browser on backend
    try {
      await fetch('/api/account/login-cancel', { method: 'POST' });
    } catch (e) {
      console.error('Failed to cancel login:', e);
    }
    
    resetLoginForm();
    toggleAccountForm();
  }

  function showLoginStatus(msg, type) {
    const statusEl = document.getElementById('login-status');
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
    
    if (type === 'error') {
      statusEl.style.background = '#7f1d1d';
      statusEl.style.color = '#fca5a5';
      statusEl.style.border = '1px solid #991b1b';
    } else if (type === 'success') {
      statusEl.style.background = '#14532d';
      statusEl.style.color = '#86efac';
      statusEl.style.border = '1px solid #166534';
    } else {
      statusEl.style.background = '#1e3a8a';
      statusEl.style.color = '#93c5fd';
      statusEl.style.border = '1px solid #1e40af';
    }
  }

  // ── SSE ────────────────────────────────────────────────────────────────────
  function setConn(ok) {
    dot.className = 'dot' + (ok ? '' : ' off');
    connLabel.textContent = ok ? 'Live' : 'Reconnecting…';
  }

  function connect() {
    const es = new EventSource('/stream');
    es.onopen    = () => setConn(true);
    es.onerror   = () => { setConn(false); es.close(); setTimeout(connect, 3000); };
    es.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'product') upsertRow(msg.data);
      if (msg.type === 'delete') {
        document.getElementById('row-' + msg.pid)?.remove();
        delete lastSuccessTs[msg.pid];
      }
    };
  }

  // Load current account on page load
  loadCurrentAccount();
  
  connect();
</script>
</body>
</html>
